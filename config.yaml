buildConfiguration:
  buildCommand: npm run build
  installDependenciesStep:
    command: npm install
    requiredFiles:
      - package.json
      - package-lock.json
      - .npmrc
livePreviewConfiguration:
  setupCommand: ":"
# Authentication can be setup here. First, follow the instructions to create
# the authentication policy via the admin console and then specify the policy
# name here.
# authentication:
#  policyName: test-auth0-policy
#  includePaths:
#    - /admin/*
sitemap:
  fileName: custom/sitemap
staticRoutes:
  - from: /queryparamchain
    to: /redirectqueryparam?baz=boo
    status: 301
  - from: /redirectqueryparam
    to: /index.html?foo=bar
    status: 303
dynamicRoutes:
  - from: /dynamicqueryparam/*
    to: /:splat?foo=bar
    status: 301

